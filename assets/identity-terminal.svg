<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Zixu Song identity terminal</title>
  <desc id="desc">A dark AI systems terminal card introducing Zixu Song.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07101d"/>
      <stop offset="1" stop-color="#101126"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#36f1cd"/>
      <stop offset=".5" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#29405e" stroke-width="1" opacity=".34"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1100" height="500" rx="24" fill="url(#bg)"/>
  <rect width="1100" height="500" rx="24" fill="url(#grid)"/>
  <rect x="22" y="22" width="1056" height="456" rx="16" fill="#070b13" fill-opacity=".72" stroke="#243957"/>
  <path d="M22 83H1078" stroke="#2b4264"/>
  <circle cx="53" cy="53" r="7" fill="#ff7474"/>
  <circle cx="79" cy="53" r="7" fill="#f4c95d"/>
  <circle cx="105" cy="53" r="7" fill="#36f1cd"/>
  <text x="138" y="59" fill="#6f8bad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">SYSTEM // IDENTITY_TERMINAL</text>
  <text x="66" y="142" fill="#36f1cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">01 / OPERATOR PROFILE</text>
  <text x="66" y="221" fill="#e7efff" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" letter-spacing="2">ZIXU SONG</text>
  <text x="70" y="263" fill="#9fb5d5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3">AI APPLICATION ENGINEER</text>
  <rect x="66" y="294" width="545" height="1" fill="url(#edge)"/>
  <text x="66" y="334" fill="#cdd9ed" font-family="Arial, Helvetica, sans-serif" font-size="23">Bridging business logic and technology.</text>
  <text x="66" y="368" fill="#92a9c8" font-family="Arial, Helvetica, sans-serif" font-size="20">Turning complex requirements into practical AI systems.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.4">
    <rect x="66" y="406" width="166" height="38" rx="7" fill="#10293a" stroke="#2e806f"/>
    <text x="84" y="431" fill="#63f4d4">CONTEXT FIRST</text>
    <rect x="246" y="406" width="174" height="38" rx="7" fill="#15213b" stroke="#4b70b4"/>
    <text x="266" y="431" fill="#9db9ff">SYSTEM DESIGN</text>
    <rect x="434" y="406" width="177" height="38" rx="7" fill="#261e40" stroke="#846fc2"/>
    <text x="455" y="431" fill="#cfbcff">USEFUL DELIVERY</text>
  </g>
  <g transform="translate(725 133)">
    <circle cx="134" cy="116" r="95" fill="#0c1727" stroke="#345171" stroke-width="2"/>
    <circle cx="134" cy="116" r="72" fill="none" stroke="#24415d" stroke-width="1" stroke-dasharray="5 8"/>
    <circle cx="134" cy="116" r="11" fill="#36f1cd" filter="url(#glow)"/>
    <circle cx="38" cy="69" r="9" fill="#7aa2ff"/>
    <circle cx="228" cy="48" r="8" fill="#a78bfa"/>
    <circle cx="234" cy="174" r="8" fill="#36f1cd"/>
    <circle cx="63" cy="201" r="8" fill="#7aa2ff"/>
    <path d="M45 73L124 110M222 54L143 110M226 171L144 121M69 196L126 124" stroke="#54769b" stroke-width="2"/>
    <text x="134" y="279" text-anchor="middle" fill="#7d9bbc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">EVIDENCE TRAJECTORY</text>
  </g>
  <rect x="22" y="474" width="1056" height="4" rx="2" fill="url(#edge)"/>
</svg>
