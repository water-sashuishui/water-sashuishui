<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Evidence trajectory system map</title>
  <desc id="desc">A system map from business context through evidence and graph reasoning to delivery.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#36f1cd"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#385274" opacity=".45"/></pattern>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="760" height="500" rx="24" fill="#09111d"/>
  <rect width="760" height="500" rx="24" fill="url(#dots)"/>
  <text x="42" y="57" fill="#36f1cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">SYSTEM MAP // 02</text>
  <text x="42" y="92" fill="#e7efff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">FROM CONTEXT TO CONFIDENCE</text>
  <path d="M93 184H655" stroke="#355473" stroke-width="2" stroke-dasharray="5 8"/>
  <path d="M188 184H270M350 184H432M512 184H595" stroke="url(#line)" stroke-width="3"/>
  <path d="M260 176L274 184L260 192M422 176L436 184L422 192M585 176L599 184L585 192" fill="none" stroke="#87a8d1" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(45 145)">
      <rect width="145" height="78" rx="10" fill="#0f2b38" stroke="#36a991"/>
      <circle cx="22" cy="22" r="5" fill="#36f1cd" filter="url(#halo)"/>
      <text x="20" y="58" fill="#d8fff6" font-size="13" letter-spacing=".4">BUSINESS CONTEXT</text>
    </g>
    <g transform="translate(270 145)">
      <rect width="145" height="78" rx="10" fill="#111f38" stroke="#648ed5"/>
      <circle cx="22" cy="22" r="5" fill="#7aa2ff" filter="url(#halo)"/>
      <text x="20" y="48" fill="#e0eaff" font-size="14" letter-spacing="1">EVIDENCE</text><text x="20" y="66" fill="#a8c0f0" font-size="14" letter-spacing="1">LAYER</text>
    </g>
    <g transform="translate(495 145)">
      <rect width="145" height="78" rx="10" fill="#211b38" stroke="#8a70c8"/>
      <circle cx="22" cy="22" r="5" fill="#a78bfa" filter="url(#halo)"/>
      <text x="20" y="48" fill="#eee7ff" font-size="14" letter-spacing="1">GRAPH</text><text x="20" y="66" fill="#c7b5ee" font-size="14" letter-spacing="1">REASONING</text>
    </g>
  </g>
  <g transform="translate(84 300)">
    <rect width="592" height="132" rx="16" fill="#0a1726" stroke="#284361"/>
    <text x="29" y="37" fill="#7d9bbc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">DESIGN PRINCIPLE</text>
    <text x="29" y="75" fill="#e2ebfa" font-family="Arial, Helvetica, sans-serif" font-size="23">Use the smallest useful system.</text>
    <text x="29" y="106" fill="#a6b9d3" font-family="Arial, Helvetica, sans-serif" font-size="18">Keep decisions traceable. Keep people in the loop.</text>
    <circle cx="525" cy="67" r="28" fill="none" stroke="#36f1cd" stroke-width="2"/>
    <path d="M511 68L523 80L544 54" fill="none" stroke="#36f1cd" stroke-width="3"/>
  </g>
  <text x="42" y="469" fill="#5e7799" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">CONTEXT → EVIDENCE → REASONING → DELIVERY</text>
</svg>
